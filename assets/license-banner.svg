<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
<title id="title">VRCL Client License</title><desc id="desc">Colorful VRCL Client License banner</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09050f"/><stop offset=".45" stop-color="#2a0d54"/><stop offset=".78" stop-color="#6721d2"/><stop offset="1" stop-color="#a63cff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#e08cff" stop-opacity=".7"/><stop offset="1" stop-color="#e08cff" stop-opacity="0"/></radialGradient>
 <linearGradient id="text"><stop stop-color="#fff"/><stop offset="1" stop-color="#e6d5ff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1400" height="300" rx="32" fill="url(#bg)"/>
<circle cx="1160" cy="48" r="235" fill="url(#glow)" filter="url(#blur)"/>
<rect x="82" y="58" width="1236" height="184" rx="26" fill="#0a0512" opacity=".25" stroke="#ddbfff" stroke-opacity=".3"/>
<rect x="102" y="78" width="5" height="144" rx="2.5" fill="#ff63cf"/>
<rect x="1293" y="78" width="5" height="144" rx="2.5" fill="#8c5cff"/>
<text x="700" y="130" text-anchor="middle" fill="url(#text)" font-family="Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="5">VRCL CLIENT</text>
<text x="700" y="184" text-anchor="middle" fill="#f0ddff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="10">LICENSE</text>
<rect x="555" y="211" width="290" height="32" rx="16" fill="#a855f7" fill-opacity=".22" stroke="#dfc1ff" stroke-opacity=".48"/>
<text x="700" y="232" text-anchor="middle" fill="#e9d8ff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">SOURCE • USE • BRANDING</text>
</svg>