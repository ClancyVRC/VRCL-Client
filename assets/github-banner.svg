<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
<title id="title">VRCL Client</title><desc id="desc">Colorful VRCL Client VRChat launcher banner</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08050f"/><stop offset=".42" stop-color="#24104d"/><stop offset=".76" stop-color="#5b20c9"/><stop offset="1" stop-color="#a33cff"/></linearGradient>
 <radialGradient id="purple"><stop stop-color="#d58cff" stop-opacity=".72"/><stop offset="1" stop-color="#d58cff" stop-opacity="0"/></radialGradient>
 <radialGradient id="pink"><stop stop-color="#ff62c8" stop-opacity=".48"/><stop offset="1" stop-color="#ff62c8" stop-opacity="0"/></radialGradient>
 <linearGradient id="white"><stop stop-color="#fff"/><stop offset="1" stop-color="#e5d4ff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1400" height="360" rx="34" fill="url(#bg)"/>
<circle cx="1160" cy="105" r="260" fill="url(#purple)" filter="url(#blur)"/>
<circle cx="230" cy="310" r="220" fill="url(#pink)" filter="url(#blur)"/>
<circle cx="1180" cy="300" r="100" fill="#b64cff" opacity=".16"/>
<rect x="74" y="62" width="1252" height="236" rx="28" fill="#0b0614" opacity=".24" stroke="#d9b5ff" stroke-opacity=".28"/>
<rect x="92" y="80" width="5" height="200" rx="2.5" fill="#ff63cf"/>
<rect x="1303" y="80" width="5" height="200" rx="2.5" fill="#8c5cff"/>
<text x="700" y="158" text-anchor="middle" fill="url(#white)" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="5">VRCL CLIENT</text>
<text x="700" y="210" text-anchor="middle" fill="#f0ddff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="8">VRCHAT LAUNCHER</text>
<rect x="548" y="244" width="304" height="42" rx="21" fill="#a855f7" fill-opacity=".24" stroke="#e7cfff" stroke-opacity=".58"/>
<text x="700" y="272" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">WINDOWS • X64</text>
