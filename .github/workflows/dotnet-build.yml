name: VRCL Update Infrastructure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  updater:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore updater
        run: dotnet restore "VRCL Updater/VRCL Updater.csproj"

      - name: Build updater
        run: dotnet build "VRCL Updater/VRCL Updater.csproj" -c Release --no-restore

      - name: Publish updater
        run: dotnet publish "VRCL Updater/VRCL Updater.csproj" -c Release -r win-x64 --self-contained false -o "publish/VRCL Updater"

      - name: Verify updater
        shell: pwsh
        run: |
          $exe = "publish/VRCL Updater/VRCL Updater.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "VRCL Updater.exe was not produced."
          }

      - name: Validate GitHub update metadata
        shell: pwsh
        run: |
          $required = @(
            "VRCL Client/Update/GitHubUpdateChecker.cs",
            "VRCL Client/Update/github_release_config.template.json",
            "VRCL Client/Update/release_structure.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required GitHub update file missing: $path"
            }
          }

      - name: Validate repository configuration
        shell: pwsh
        run: |
          $config = Get-Content "VRCL Client/Update/github_release_config.template.json" -Raw | ConvertFrom-Json
          if ($config.repository.owner -ne "ClancyVRC" -or $config.repository.name -ne "VRCL-Client") {
            throw "GitHub repository configuration is incorrect."
          }
          if ($config.channels.beta.prerelease -ne $true) {
            throw "Beta channel must target prerelease GitHub releases."
          }